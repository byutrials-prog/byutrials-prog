    *,

      -webkit-text-size-adjust: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    body.min-h-screen {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #root {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

      width: 6px;
      height: 6px;
    }

      background: #0f172a;

    /* iOS PWA: prevent overscroll bounce effect */

      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;

        flex-direction: column !important;
        gap: 0 !important;
      }

        height: 60px !important;
      }

      .app-nav-item-text {
        font-size: 9px !important;
      }
    }

<body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
          console.log('[PWA] Service Worker registered:', reg.scope);

          // Cek update SW
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[PWA] Update tersedia. Reload untuk memperbarui.');
              }
            });
          });
        } catch (err) {
          console.error('[PWA] Service Worker gagal didaftarkan:', err);
        }
      });
    }

    // iOS: Deteksi mode standalone (sudah diinstall)
    if (window.navigator.standalone === true) {
      console.log('[PWA] Berjalan sebagai app iOS standalone');
      document.documentElement.classList.add('pwa-ios-standalone');
    }

    // Android/Desktop: Tangkap event beforeinstallprompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.__pwaInstallPrompt = deferredPrompt;
      window.dispatchEvent(new CustomEvent('pwa-installable'));
      console.log('[PWA] App siap diinstall');
    });

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App berhasil diinstall');
      deferredPrompt = null;
      window.__pwaInstallPrompt = null;
    });
  </script>
</body>
